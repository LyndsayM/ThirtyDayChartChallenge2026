<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyndsay Miles - 30 Day Chart Challenge 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .gallery-item-image-container {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            overflow: hidden;
        }

        .gallery-item img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }

        .gallery-item-info {
            padding: 15px;
            text-align: center;
        }

        .gallery-item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s ease;
        }

        .modal.open {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-image {
            max-width: 100%;
            max-height: 80vh;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .modal-title {
            text-align: center;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #333;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: #667eea;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #333;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 15px;
            transition: color 0.2s ease;
            user-select: none;
        }

        .modal-nav:hover {
            color: #667eea;
        }

        .modal-prev {
            left: 10px;
        }

        .modal-next {
            right: 10px;
        }

        footer {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            margin-top: 40px;
        }

        footer p {
            font-size: 1rem;
        }

        .github-link {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid white;
        }

        .github-link:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .gallery-item-image-container {
                height: 200px;
            }

            .modal-content {
                padding: 15px;
            }

            .modal-close {
                top: 10px;
                right: 15px;
                font-size: 24px;
            }

            .modal-nav {
                font-size: 24px;
                padding: 8px 12px;
            }

            .modal-prev {
                left: 5px;
            }

            .modal-next {
                right: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>30 Day Chart Challenge 2026</h1>
            <p class="subtitle">A collection of data visualizations and charts</p>
        </header>

        <div class="gallery" id="gallery"></div>

        <footer>
            <p>&copy; 2026 <strong>Lyndsay Miles</strong> | 
                <a href="https://github.com/LyndsayM/ThirtyDayChartChallenge2026" class="github-link">View on GitHub</a>
            </p>
        </footer>
    </div>

    <!-- Modal for enlarged image view -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <span class="modal-nav modal-prev" id="prevImage">&#10094;</span>
            <img id="modalImage" class="modal-image" src="" alt="">
            <div class="modal-title" id="modalTitle"></div>
            <span class="modal-nav modal-next" id="nextImage">&#10095;</span>
        </div>
    </div>

    <script>
        // List of image files in the img folder
        const images = [
            'cc_2026_day1.png',
            'cc_2026_day2.png',
            'cc_2026_day3.png',
            'cc_2026_day4.png',
            'cc_2026_day5.png',
            'cc_2026_day6.png',
            'cc_2026_day7.png',
            'cc_2026_day8.png',
            'cc_2026_day9.png',
            'cc_2026_day10.png',
            'cc_2026_day11.png',
            'cc_2026_day12.png',
            'cc_2026_day13.png',
            'cc_2026_day14.png',
            'cc_2026_day15_16.png',
            'cc_2026_day17.png',
            'cc_2026_day18.png',
            'cc_2026_day19.png',
            'cc_2026_day20.png',
            'cc_2026_day21.png',
            'cc_2026_day22_datawrapper.png',
            'cc_2026_day23.png',
            'cc_2026_day24.png',
            'cc_2026_day25.png',
            'cc_2026_day26.png',
            'cc_2026_day27.gif',
            'cc_2026_day28.png',
            'cc_2026_day29.gif',
            'cc_2026_day30.png'
        ];

        const gallery = document.getElementById('gallery');
        const baseUrl = 'https://raw.githubusercontent.com/LyndsayM/ThirtyDayChartChallenge2026/main/img/';
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const closeBtn = document.getElementById('closeModal');
        const prevBtn = document.getElementById('prevImage');
        const nextBtn = document.getElementById('nextImage');

        let currentImageIndex = 0;

        // Function to extract day label from filename
        function getDayLabel(filename) {
            // Special case for day15_16
            if (filename.includes('day15_16')) {
                return 'Day 15 & 16';
            }
            // Extract day number for other files
            const match = filename.match(/day(\d+)/);
            return match ? `Day ${match[1]}` : 'Unknown';
        }

        // Populate gallery
        images.forEach((image, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            const dayLabel = getDayLabel(image);
            
            item.innerHTML = `
                <div class="gallery-item-image-container">
                    <img src="${baseUrl}${image}" alt="${dayLabel}">
                </div>
                <div class="gallery-item-info">
                    <div class="gallery-item-title">${dayLabel}</div>
                </div>
            `;
            
            item.addEventListener('click', () => openModal(index));
            gallery.appendChild(item);
        });

        // Modal functions
        function openModal(index) {
            currentImageIndex = index;
            updateModalImage();
            imageModal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            imageModal.classList.remove('open');
            document.body.style.overflow = 'auto';
        }

        function updateModalImage() {
            const image = images[currentImageIndex];
            const dayLabel = getDayLabel(image);
            modalImage.src = baseUrl + image;
            modalImage.alt = dayLabel;
            modalTitle.textContent = dayLabel;
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            updateModalImage();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
            updateModalImage();
        }

        // Event listeners
        closeBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', nextImage);
        prevBtn.addEventListener('click', prevImage);

        // Close modal when clicking outside the content
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (imageModal.classList.contains('open')) {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'Escape') closeModal();
            }
        });
    </script>
</body>
</html>
